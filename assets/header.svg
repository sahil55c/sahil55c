<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="Divyansh Chauhan - Full-Stack Developer">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b0f19"/><stop offset="1" stop-color="#111827"/>
  </linearGradient>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
    <stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#f472b6"/>
    <animate attributeName="x1" values="-1;0;-1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="0;1;0" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
  </pattern>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="round"><rect width="1000" height="340" rx="22"/></clipPath>
</defs>
<style>
  .name{font:800 62px 'Segoe UI','SF Pro Display',-apple-system,'Helvetica Neue',Arial,sans-serif;letter-spacing:-1.5px}
  .role{font:500 22px 'Segoe UI','SF Pro Display',-apple-system,'Helvetica Neue',Arial,sans-serif;fill:#cbd5e1}
  .tag{font:600 13px 'SF Mono','Fira Code','JetBrains Mono',Consolas,'Courier New',monospace;fill:#94a3b8;letter-spacing:.5px}
  .sub{opacity:0;animation:sub 12s infinite}
  .s1{animation-delay:0s} .s2{animation-delay:4s} .s3{animation-delay:8s}
  @keyframes sub{0%{opacity:0;transform:translateY(10px)}4%,29%{opacity:1;transform:translateY(0)}33%,100%{opacity:0;transform:translateY(-10px)}}
  .pulse{animation:pulse 2s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(2.2);opacity:0}}
  .float{animation:float 5s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .enter{animation:enter 1.2s ease-out both}
  @keyframes enter{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
</style>
<g clip-path="url(#round)">
  <rect width="1000" height="340" fill="url(#bg)"/>
  <g filter="url(#blur)">
    <circle r="130" fill="#22d3ee" fill-opacity="0.35"><animate attributeName="cx" values="120;380;120" dur="14s" repeatCount="indefinite"/><animate attributeName="cy" values="80;260;80" dur="11s" repeatCount="indefinite"/></circle>
    <circle r="150" fill="#8b5cf6" fill-opacity="0.38"><animate attributeName="cx" values="620;860;620" dur="16s" repeatCount="indefinite"/><animate attributeName="cy" values="260;60;260" dur="13s" repeatCount="indefinite"/></circle>
    <circle r="110" fill="#f472b6" fill-opacity="0.28"><animate attributeName="cx" values="820;520;820" dur="18s" repeatCount="indefinite"/><animate attributeName="cy" values="300;120;300" dur="15s" repeatCount="indefinite"/></circle>
  </g>
  <rect width="1000" height="340" fill="url(#grid)"/>
  <rect y="-4" width="1000" height="2" fill="#22d3ee" fill-opacity="0.35"><animate attributeName="y" values="-4;344" dur="6s" repeatCount="indefinite"/></rect>

  <!-- floating code glyphs -->
  <g font-family="'SF Mono','Fira Code','JetBrains Mono',Consolas,'Courier New',monospace" font-size="26" font-weight="700" fill="#ffffff" fill-opacity="0.10">
    <text x="840" y="90" class="float">&lt;/&gt;</text>
    <text x="900" y="250" class="float" style="animation-delay:-2s">{ }</text>
    <text x="760" y="290" class="float" style="animation-delay:-3.5s">0x1F</text>
    <text x="70" y="300" class="float" style="animation-delay:-1s">=&gt;</text>
  </g>

  <!-- status pill -->
  <g class="enter">
    <rect x="60" y="52" width="232" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="82" cy="69" r="5" fill="#22c55e" class="pulse"/>
    <circle cx="82" cy="69" r="5" fill="#22c55e"/>
    <text x="98" y="74" class="tag">OPEN TO COLLABORATION</text>
  </g>

  <g class="enter" style="animation-delay:.2s">
    <text x="60" y="165" class="name" fill="url(#name)" filter="url(#glow)">Divyansh Chauhan</text>
    <text x="62" y="205" class="role">Full-Stack Developer</text>
  </g>

  <g font-family="'SF Mono','Fira Code','JetBrains Mono',Consolas,'Courier New',monospace" font-size="17" fill="#22d3ee" transform="translate(62 250)">
    <text class="sub s1">&gt; Building modern web &amp; app products</text>
    <text class="sub s2" fill="#a78bfa">&gt; AI · Web3 · Automation</text>
    <text class="sub s3" fill="#f472b6">&gt; Clean code. Real products. Always shipping.</text>
  </g>
  <rect x="0" y="0" width="1000" height="340" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
</g>
</svg>